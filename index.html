<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Concept</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: url('bg.jpg') center/cover no-repeat;
  color: white;
}

/* overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  top: 0;
  left: 0;
  z-index: 0;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  z-index: 3;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
}

.navbar a:hover {
  color: #ff5a1f;
}

/* CONTENT */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-top: 150px;
}

h1 {
  font-size: 48px;
  letter-spacing: 3px;
}

.player {
  margin-top: 40px;
}

button {
  margin-top: 15px;
  padding: 10px 25px;
  background: #ff5a1f;
  border: none;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #e14d1a;
}


/* COUNTDOWN */
#countdown { position: fixed; top: 18px; right: 30px; z-index: 4; text-align: right; color: white; }
.countdown-title { font-size: 11px; letter-spacing: 3px; opacity: 0.7; margin-bottom: 4px; }
#timer { font-size: 20px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.45); }
</style>
</head>

<body>

<div class="overlay"></div>

<!-- COUNTDOWN -->
<div id="countdown">
  <div class="countdown-title">NEXT EVENT</div>
  <div id="timer">00d 00h 00m 00s</div>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <div>ROCK CONCEPT</div>

  <div>
    <a href="producers.html">Producers</a>
    <a href="chat.html">Chat</a>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <h1>LIVE RADIO</h1>

  <div class="player">
    <audio id="audio" src="http://YOUR_SERVER_IP:8000/live"></audio>

    <button onclick="togglePlay()">Play / Pause</button>

    <p id="nowPlaying">Loading...</p>
  </div>

</div>

<script>
const audio = document.getElementById("audio");

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

/* Now Playing */
async function fetchNowPlaying() {
  try {
    const res = await fetch("http://YOUR_SERVER_IP:8000/status-json.xsl");
    const data = await res.json();

    const title = data.icestats.source.title || "Live";
    document.getElementById("nowPlaying").innerText = title;
  } catch {
    document.getElementById("nowPlaying").innerText = "Live";
  }
}

setInterval(fetchNowPlaying, 5000);
fetchNowPlaying();

/* Countdown to 14/12/2026 13:20 */
const targetDate = new Date("2026-12-14T13:20:00+02:00").getTime();
function updateCountdown() {
  const distance = targetDate - new Date().getTime();
  if (distance <= 0) { document.getElementById("timer").innerText = "00d 00h 00m 00s"; return; }
  const days = Math.floor(distance / 86400000);
  const hours = Math.floor((distance % 86400000) / 3600000);
  const minutes = Math.floor((distance % 3600000) / 60000);
  const seconds = Math.floor((distance % 60000) / 1000);
  document.getElementById("timer").innerText = String(days).padStart(2,"0")+"d "+String(hours).padStart(2,"0")+"h "+String(minutes).padStart(2,"0")+"m "+String(seconds).padStart(2,"0")+"s";
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
